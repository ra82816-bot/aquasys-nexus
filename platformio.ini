; ==========================================
; PlatformIO Configuration for AquaSys Nexus
; ==========================================
;
; ✅ PRIORIDADE II.2: Injeção de Segredos via Build Flags
;
; Para uso seguro em produção:
; 1. Defina as variáveis de ambiente no seu sistema/CI:
;    export SUPABASE_URL="https://seu-projeto.supabase.co"
;    export SUPABASE_ANON_KEY="sua-chave-anon-aqui"
;    export MQTT_BROKER="seu-broker.hivemq.cloud"
;    export MQTT_USER="seu-usuario-mqtt"
;    export MQTT_PASS="sua-senha-mqtt"
;    export AP_PASSWORD="sua-senha-ap-forte"
;
; 2. Execute: pio run -e sensor_production
;
; ==========================================

[platformio]
default_envs = sensor_dev, actuator_dev

; ==================== SENSOR ENVIRONMENTS ====================

[env:sensor_dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps = 
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/DHT sensor library@^1.4.6
    milesburton/DallasTemperature@^3.11.0
    onewire/OneWire@^2.3.7
    bblanchon/ArduinoJson@^6.21.5
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.1

build_flags = 
    -D FIRMWARE_VERSION=\"v4.3.4-DEV\"
    -D LOG_LEVEL=3  ; DEBUG
    ; ⚠️ Credenciais de desenvolvimento (NUNCA usar em produção)
    -D SUPABASE_URL=\"https://oaabtbvwxsjomeeizciq.supabase.co\"
    -D SUPABASE_ANON_KEY=\"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hYWJ0YnZ3eHNqb21lZWl6Y2lxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkzNzI4NzEsImV4cCI6MjA3NDk0ODg3MX0.ZcCr9BFJPMNfy409gkK8VucnfXhluX82LJ8f4HI4bPw\"
    -D MQTT_BROKER_FALLBACK=\"d69b78cddf16427ea0f6a88bac67f63e.s1.eu.hivemq.cloud\"
    -D MQTT_FALLBACK_USER=\"hydrosmart\"
    -D MQTT_FALLBACK_PASS=\"Hydro@2024!\"
    -D AP_PASSWORD=\"hydrosmart2024\"

[env:sensor_production]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps = 
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/DHT sensor library@^1.4.6
    milesburton/DallasTemperature@^3.11.0
    onewire/OneWire@^2.3.7
    bblanchon/ArduinoJson@^6.21.5
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.1

build_flags = 
    -D FIRMWARE_VERSION=\"v4.3.4-PROD\"
    -D LOG_LEVEL=2  ; INFO
    ; ✅ Injetar credenciais via variáveis de ambiente
    -D SUPABASE_URL=\"${env:SUPABASE_URL}\"
    -D SUPABASE_ANON_KEY=\"${env:SUPABASE_ANON_KEY}\"
    -D MQTT_BROKER_FALLBACK=\"${env:MQTT_BROKER}\"
    -D MQTT_FALLBACK_USER=\"${env:MQTT_USER}\"
    -D MQTT_FALLBACK_PASS=\"${env:MQTT_PASS}\"
    -D AP_PASSWORD=\"${env:AP_PASSWORD}\"

